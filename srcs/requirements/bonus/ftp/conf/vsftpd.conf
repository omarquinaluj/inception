listen=YES
listen_ipv6=NO

anonymous_enable=NO

local_enable=YES
write_enable=YES

download_enable=YES
dirlist_enable=YES

chroot_local_user=YES
allow_writeable_chroot=YES

local_root=/var/www/html

pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES

check_shell=NO

idle_session_timeout=600
data_connection_timeout=120
