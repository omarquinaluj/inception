services:

  mariadb:
    build: ./requirements/mariadb
    image: inception-mariadb:1.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: inception-wordpress:1.0
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: inception-nginx:1.0
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  redis:
    build: ./requirements/bonus/redis
    image: inception-redis:1.0
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build: ./requirements/bonus/adminer
    image: inception-adminer:1.0
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - inception

  website:
    build: ./requirements/bonus/website
    image: inception-website:1.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - inception

  ftp:
    build: ./requirements/bonus/ftp
    image: inception-ftp:1.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    networks:
      - inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/owmarqui/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/owmarqui/data/wordpress

networks:
  inception:
    driver: bridge
